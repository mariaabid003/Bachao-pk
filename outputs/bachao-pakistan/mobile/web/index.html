<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05091A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bachao Pakistan</title>
    <meta name="description" content="Karachi's predictive urban safety platform" />
    <style>
      * { box-sizing: border-box; }
      html { height: 100%; background: #05091A; }
      body {
        margin: 0; padding: 0; height: 100%;
        background: #05091A; overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        -webkit-user-select: none; user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #root {
        width: 100%; height: 100%; min-height: 100vh;
        background: #05091A; position: relative;
      }
      [role="button"], [tabindex] { cursor: pointer; }

      /* Desktop: phone frame */
      @media (min-width: 520px) {
        html {
          background: radial-gradient(ellipse at 50% 0%, #0D1A3A 0%, #05091A 60%);
          min-height: 100vh;
        }
        body {
          display: flex; justify-content: center; align-items: flex-start;
          padding: 24px 0 40px; background: transparent; min-height: 100vh;
        }
        #root {
          max-width: 390px; width: 100%;
          min-height: calc(100vh - 64px);
          border-radius: 36px; overflow: hidden;
          box-shadow:
            0 0 0 1px rgba(255,255,255,0.08),
            0 32px 80px rgba(0,0,0,0.7),
            0 0 120px rgba(239,68,68,0.06);
        }
        #root::before {
          content: '';
          position: absolute; top: 12px;
          left: 50%; transform: translateX(-50%);
          width: 110px; height: 26px;
          background: #000; border-radius: 16px;
          z-index: 9999; pointer-events: none;
        }
      }
      ::-webkit-scrollbar { display: none; }
      * { scrollbar-width: none; }
    </style>
  </head>
  <body><div id="root"></div></body>
</html>
